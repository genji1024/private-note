# docker-compose.yml for private-note on a single VPS.
#
# Build-time env (NEXT_PUBLIC_*) is inlined into the client bundle during
# `next build` and is supplied via `build.args`.
# Runtime env (server-side secrets) is supplied via `environment`/`env_file`.
#
# PORT（ポート番号）は `.env` が単一の情報源。デフォルト値は持たないため、
# .env に必ず設定する（.env.example をコピーして値を埋めれば OK）。
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-private_note}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ホストから直接 psql する場合のみ必要（省略可）
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      # S3 API / Web コンソール
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        # PORT は .env から展開（ports マッピングと同一の値）
        PORT: ${PORT}
    image: private-note:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Plain Postgres（drizzle/pg Pool 用）
      DATABASE_URL: postgres://app:app@postgres:5432/private_note
      # MinIO（S3 互換オブジェクトストレージ）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # ホスト/コンテナ双方とも .env の PORT を使用
      - "${PORT}:${PORT}"

volumes:
  postgres_data:
  minio_data:
